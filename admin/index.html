<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Charles’Vibe · Studio</title><link rel="stylesheet" href="admin.css"></head><body><header><a href="../">Charles’Vibe</a><span>Studio / 内容管理</span></header><main><section><h1>作品与专题</h1><p>先保存本地草稿，确认后发布。令牌只保留在当前页面内存中。</p><label>GitHub Token <input id="token" type="password" autocomplete="off" placeholder="选择 Charles-Vibe 仓库，并授予 Contents: Read and write"></label><button id="connect">连接并读取最新内容</button><button id="draft">保存本地草稿</button><button id="restore">恢复本地草稿</button><button id="publish">发布到网站</button><p id="status" role="status" aria-live="polite">正在读取作品…</p></section><section id="editor"><div class="toolbar"><label>专题<select id="collections"></select></label><button id="addCollection">新增专题</button><button id="removeCollection">删除专题</button><label>编辑语言<select id="language"><option value="zh">中文</option><option value="en">English</option><option value="ja">日本語</option><option value="ko">한국어</option></select></label></div><div id="collectionFields"></div><label class="upload">批量添加照片<input id="upload" type="file" multiple accept="image/jpeg,image/png,image/webp"></label><p>上传会生成最长边 2200px 的高质量 JPEG，保留完整构图。二维码不会受影响。调整顺序后，首页仍会随机展示。</p><div id="photos"></div><details><summary>首页文字</summary><div id="labels"></div></details></section></main><script src="../content.js"></script><script src="admin.js"></script></body></html>
